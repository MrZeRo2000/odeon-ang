<p-confirmpopup key="tags"></p-confirmpopup>

<p-dialog [(visible)]="displayProp" [style]="{width: '50vw'}" [modal]="true" styleClass="p-fluid" header="Tags">
  <ng-template #content>
    <form [formGroup]="editForm">
      <p-fluid class="mb-4">
        <p-auto-complete
          [dropdown]="true"
          [suggestions]="filteredTags"
          (completeMethod)="searchTags($event)"
          id="tags"
          formControlName="tags"
          [multiple]="true"
          class="mt-2"
          (onKeyUp)="tagsKeyUp($event)"
          appendTo="body"
          >
        </p-auto-complete>
      </p-fluid>
    </form>
  </ng-template>

  <ng-template #footer>
    <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-text" (click)="hideDialog()"></p-button>
    <p-button label="Save" icon="pi pi-check" styleClass="p-button-text" (click)="save()"></p-button>
  </ng-template>

  @if (saveAction$ | async ) {
  }

</p-dialog>
