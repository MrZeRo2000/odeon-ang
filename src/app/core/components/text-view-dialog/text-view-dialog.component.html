<p-dialog [header]="header" [(visible)]="displayProp" [modal]="true" [position]="dialogPosition" [style]="dialogStyle"
  [draggable]="false" [resizable]="false">
  @if (htmlText) {
    <p class="m-0" [innerHTML]=htmlText></p>
  }
  @if (text) {
    <pre>{{text}}</pre>
  }
  <ng-template #footer>
    <button pButton type="button" [text]="true" (click)="displayProp=false"><i class="pi pi-check"></i>Ok</button>
  </ng-template>
</p-dialog>
